<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#0c1424"><title>محاسبي</title>
<style>
:root{--bg:#09101d;--panel:#111d30;--panel2:#17253b;--gold:#d9b45b;--txt:#f5f1e7;--muted:#aab5c6;--green:#57c69b;--red:#f07878}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}header{padding:16px 18px;background:linear-gradient(140deg,#172943,#0c1424);border-bottom:1px solid #28364b;position:sticky;top:0;z-index:4}.headrow{display:flex;align-items:center;justify-content:space-between;gap:12px}.backbtn{background:#17253b;border:1px solid #42516a;color:#f5f1e7;border-radius:10px;padding:9px 13px;font-weight:700}.auth-wrap{max-width:460px;margin:28px auto;padding:0 14px}.auth-card{background:var(--panel);border:1px solid #34445d;border-radius:18px;padding:20px;box-shadow:0 14px 40px #0005}.auth-card h2{margin:4px 0 8px;color:var(--gold)}.auth-mark{text-align:center;font-size:42px;color:var(--gold);margin-bottom:8px}.auth-card .btn{width:100%;margin-top:10px}.auth-switch{text-align:center;margin-top:16px;color:var(--muted);font-size:13px}.linkbtn{background:none;border:0;color:var(--gold);font-weight:800;padding:6px}.auth-note{font-size:12px;line-height:1.8;color:var(--muted);margin-top:14px}.brand{display:flex;align-items:center;gap:12px}.logo{width:45px;height:45px;border:2px solid var(--gold);border-radius:13px;display:grid;place-items:center;color:var(--gold);font-size:24px;font-weight:900}.brand h1{font-size:22px;margin:0}.brand small{color:var(--muted)}main{padding:16px 14px 95px;max-width:760px;margin:auto}.welcome{color:var(--muted);font-size:13px;margin:2px 0 16px}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat,.panel{background:var(--panel);border:1px solid #25334a;border-radius:16px;padding:15px}.stat span{font-size:12px;color:var(--muted)}.stat strong{display:block;font-size:21px;margin-top:7px;color:var(--gold)}.section-title{display:flex;justify-content:space-between;align-items:center;margin:22px 2px 10px}.section-title h2{font-size:17px;margin:0}.btn{border:0;border-radius:11px;padding:11px 14px;background:var(--gold);color:#172033;font-weight:800;font-size:13px}.btn.secondary{background:var(--panel2);color:var(--txt);border:1px solid #34445d}.btn.danger{background:#512d37;color:#ffd7d7}.actions{display:flex;gap:8px;flex-wrap:wrap}.nav{position:fixed;bottom:0;left:0;right:0;background:#101b2d;border-top:1px solid #2b3a50;display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:5}.nav button{background:none;border:0;color:var(--muted);font-size:11px;display:grid;gap:3px;justify-items:center;padding:5px}.nav button b{font-size:20px;font-weight:500}.nav button.active{color:var(--gold)}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #26354a}.row:last-child{border:0}.row small{display:block;color:var(--muted);margin-top:4px}.amount{font-weight:800;color:var(--gold);white-space:nowrap}.empty{text-align:center;color:var(--muted);padding:26px 8px}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:13px;color:var(--muted)}input,select{width:100%;padding:12px;border:1px solid #34445d;border-radius:10px;background:#0c1728;color:var(--txt);font:inherit}form .btn{width:100%;margin-top:8px}.pill{background:#26364d;color:#d9e2ee;border-radius:30px;padding:4px 9px;font-size:11px}.hidden{display:none!important}.notice{color:var(--muted);font-size:12px;line-height:1.7}.toast{position:fixed;top:14px;left:14px;right:14px;background:#203b34;color:#d7ffed;padding:12px;border-radius:10px;text-align:center;z-index:9;display:none}
</style></head><body>
<header><div class="headrow"><div class="brand"><div class="logo">م</div><div><h1>محاسبي</h1><small>إدارة حساباتك ومخزونك بسهولة</small></div></div><button id="backBtn" class="backbtn hidden" onclick="goBack()">‹ رجوع</button></div></header><main id="app"></main><div class="toast" id="toast"></div>
<nav class="nav hidden"><button data-tab="home" class="active"><b>⌂</b>الرئيسية</button><button data-tab="products"><b>▦</b>المنتجات</button><button data-tab="sales"><b>▤</b>المبيعات</button><button data-tab="expenses"><b>↘</b>المصروفات</button><button data-tab="more"><b>☷</b>المزيد</button></nav>
<script>
let KEY='mohasibi_data_v1';let db={products:[],sales:[],expenses:[]};let tab='home';let currentMerchant=null;let viewStack=[];let inForm=false;
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{products:[],sales:[],expenses:[]}}catch(e){return {products:[],sales:[],expenses:[]}}}
function save(){localStorage.setItem(KEY,JSON.stringify(db));}
function money(n){return (Number(n)||0).toLocaleString('ar-YE')+' ر.ي'}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',2200)}
function sum(a,k){return a.reduce((v,x)=>v+(Number(x[k])||0),0)}
function render(){
 inForm=false;updateBackButton();
 document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
 const root=document.getElementById('app');let content='';
 if(tab==='home'){
  const revenue=sum(db.sales,'total'),cost=sum(db.expenses,'amount'),stock=db.products.reduce((n,p)=>n+(+p.qty||0),0);
  content=`<p class="welcome">ملخص نشاطك التجاري — بيانات محفوظة على هذا الجهاز</p><div class="cards">
  <div class="stat"><span>إجمالي المبيعات</span><strong>${money(revenue)}</strong></div><div class="stat"><span>إجمالي المصروفات</span><strong>${money(cost)}</strong></div><div class="stat"><span>عدد المنتجات</span><strong>${db.products.length}</strong></div><div class="stat"><span>وحدات المخزون</span><strong>${stock}</strong></div></div>
  <div class="section-title"><h2>إجراءات سريعة</h2></div><div class="panel actions"><button class="btn" onclick="go('sales')">＋ تسجيل عملية بيع</button><button class="btn secondary" onclick="go('products')">＋ إضافة منتج</button><button class="btn secondary" onclick="go('expenses')">＋ إضافة مصروف</button></div>
  <div class="section-title"><h2>آخر المبيعات</h2><span class="pill">${db.sales.length} عملية</span></div><div class="panel">${db.sales.length?db.sales.slice(-4).reverse().map(s=>row(s.name||'بيع نقدي',s.date,money(s.total))).join(''):'<div class="empty">لا توجد مبيعات حتى الآن</div>'}</div>`;
 } else if(tab==='products'){
  content=`<div class="section-title"><h2>المنتجات والمخزون</h2><button class="btn" onclick="showForm('product')">＋ إضافة</button></div><div class="panel">${db.products.length?db.products.map((p,i)=>row(esc(p.name), 'الكمية: '+p.qty+' · سعر البيع: '+money(p.price),money((+p.qty||0)*(+p.price||0))+` <button class="btn danger" onclick="del('products',${i})">حذف</button>`)).join(''):'<div class="empty">أضف منتجاتك لتبدأ إدارة المخزون</div>'}</div>`;
 } else if(tab==='sales'){
  content=`<div class="section-title"><h2>المبيعات</h2><button class="btn" onclick="showForm('sale')">＋ بيع جديد</button></div><div class="panel">${db.sales.length?db.sales.slice().reverse().map((s,i)=>row(esc(s.name||'بيع نقدي'),s.date,money(s.total))).join(''):'<div class="empty">لم تسجل أي عملية بيع</div>'}</div>`;
 } else if(tab==='expenses'){
  content=`<div class="section-title"><h2>المصروفات</h2><button class="btn" onclick="showForm('expense')">＋ إضافة</button></div><div class="panel">${db.expenses.length?db.expenses.slice().reverse().map(e=>row(esc(e.name),e.date,money(e.amount))).join(''):'<div class="empty">لا توجد مصروفات مسجلة</div>'}</div>`;
 } else {
  content=`<div class="section-title"><h2>التقارير والنسخ الاحتياطي</h2></div><div class="panel"><div class="row"><div>إجمالي المبيعات</div><b class="amount">${money(sum(db.sales,'total'))}</b></div><div class="row"><div>إجمالي المصروفات</div><b class="amount">${money(sum(db.expenses,'amount'))}</b></div><div class="row"><div>صافي الفرق</div><b class="amount">${money(sum(db.sales,'total')-sum(db.expenses,'amount'))}</b></div><div class="row"><div>قيمة المخزون بسعر البيع</div><b class="amount">${money(db.products.reduce((n,p)=>n+(+p.qty||0)*(+p.price||0),0))}</b></div></div>
  <div class="section-title"><h2>الحساب</h2></div><div class="panel"><div class="row"><div><strong>${esc(currentMerchant?.store||currentMerchant?.merchant||"التاجر")}</strong><small>${esc(currentMerchant?.phone||"")}</small></div><button class="btn danger" onclick="logout()">تسجيل الخروج</button></div></div><div class="section-title"><h2>حماية بياناتك</h2></div><div class="panel actions"><button class="btn" onclick="backup()">تصدير نسخة احتياطية</button><button class="btn secondary" onclick="document.getElementById('restore').click()">استعادة نسخة</button><input id="restore" type="file" accept="application/json" class="hidden" onchange="restoreFile(this)"></div><p class="notice">احتفظ بنسخة احتياطية من بياناتك في مكان آمن. البيانات الحالية مخزنة محليًا على هذا الهاتف ولا تتم مزامنتها تلقائيًا مع أجهزة أخرى.</p>`;
 }
 root.innerHTML=content;
}
function row(a,b,c){return `<div class="row"><div><strong>${a}</strong><small>${esc(b||'')}</small></div><div class="amount">${c}</div></div>`}
function go(t){if(tab!==t)viewStack.push(tab);tab=t;inForm=false;render()}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>go(b.dataset.tab));
function showForm(type){
 inForm=true;updateBackButton();
 let root=document.getElementById('app'),html='';
 if(type==='product')html=`<div class="section-title"><h2>إضافة منتج</h2><button class="btn secondary" onclick="render()">رجوع</button></div><div class="panel"><form onsubmit="addProduct(event)"><div class="field"><label>اسم المنتج</label><input name="name" required maxlength="70"></div><div class="field"><label>الكمية</label><input name="qty" type="number" min="0" required></div><div class="field"><label>سعر البيع</label><input name="price" type="number" min="0" step="0.01" required></div><button class="btn">حفظ المنتج</button></form></div>`;
 if(type==='sale')html=`<div class="section-title"><h2>تسجيل عملية بيع</h2><button class="btn secondary" onclick="render()">رجوع</button></div><div class="panel"><form onsubmit="addSale(event)"><div class="field"><label>المنتج</label><select name="product" required>${db.products.map((p,i)=>`<option value="${i}">${esc(p.name)} — المتوفر ${p.qty}</option>`).join('')}</select></div><div class="field"><label>الكمية المباعة</label><input name="qty" type="number" min="1" required></div><div class="field"><label>اسم العميل (اختياري)</label><input name="customer"></div><button class="btn" ${db.products.length?'':'disabled'}>حفظ البيع</button></form>${db.products.length?'':'<p class="notice">أضف منتجًا أولًا لتسجيل البيع.</p>'}</div>`;
 if(type==='expense')html=`<div class="section-title"><h2>إضافة مصروف</h2><button class="btn secondary" onclick="render()">رجوع</button></div><div class="panel"><form onsubmit="addExpense(event)"><div class="field"><label>بيان المصروف</label><input name="name" required></div><div class="field"><label>المبلغ</label><input name="amount" type="number" min="0.01" step="0.01" required></div><button class="btn">حفظ المصروف</button></form></div>`;
 root.innerHTML=html;
}
function addProduct(e){e.preventDefault();let f=new FormData(e.target);db.products.push({name:f.get('name'),qty:+f.get('qty'),price:+f.get('price')});save();toast('تم حفظ المنتج');render()}
function addSale(e){e.preventDefault();let f=new FormData(e.target),i=+f.get('product'),q=+f.get('qty'),p=db.products[i];if(!p||q<1||q>p.qty){toast('الكمية غير متوفرة');return}p.qty-=q;db.sales.push({name:p.name+(f.get('customer')?' — '+f.get('customer'):''),qty:q,total:q*p.price,date:new Date().toLocaleDateString('ar-YE')});save();toast('تم تسجيل البيع وتحديث المخزون');render()}
function addExpense(e){e.preventDefault();let f=new FormData(e.target);db.expenses.push({name:f.get('name'),amount:+f.get('amount'),date:new Date().toLocaleDateString('ar-YE')});save();toast('تم حفظ المصروف');render()}
function del(k,i){if(confirm('هل تريد حذف هذا السجل؟')){db[k].splice(i,1);save();render()}}
function backup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='mohasibi-backup.json';a.click();URL.revokeObjectURL(url);toast('تم تجهيز النسخة الاحتياطية')}
function restoreFile(input){let file=input.files[0];if(!file)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x.products)||!Array.isArray(x.sales)||!Array.isArray(x.expenses))throw Error();if(confirm('سيتم استبدال البيانات الحالية بالنسخة المختارة. متابعة؟')){db=x;save();render();toast('تمت استعادة البيانات')}}catch(e){alert('ملف النسخة الاحتياطية غير صالح')}};r.readAsText(file)}

function accountsLoad(){try{return JSON.parse(localStorage.getItem('mohasibi_accounts_v1')||'[]')}catch(e){return []}}
function accountsSave(a){localStorage.setItem('mohasibi_accounts_v1',JSON.stringify(a))}
function updateBackButton(){var b=document.getElementById('backBtn');if(b)b.classList.toggle('hidden',!currentMerchant||(tab==='home'&&!inForm))}
function goBack(){if(!currentMerchant)return;if(inForm){render();return}if(viewStack.length){tab=viewStack.pop();render();return}if(tab!=='home'){tab='home';render();return}toast('أنت في الصفحة الرئيسية')}
function authScreen(mode,message){
 var root=document.getElementById('app'),accounts=accountsLoad(),first=accounts.length===0,reg=(mode==='register'||first);
 document.querySelector('.nav').classList.add('hidden');document.getElementById('backBtn').classList.add('hidden');
 var extra=message?'<p class="notice">'+esc(message)+'</p>':'';
 if(reg){
 root.innerHTML='<div class="auth-wrap"><div class="auth-card"><div class="auth-mark">م</div><h2>إنشاء حساب التاجر</h2><p class="notice">أنشئ حسابك المحلي للبدء في إدارة متجرك. كل حساب يحتفظ ببياناته بشكل مستقل على هذا الهاتف.</p><form onsubmit="registerMerchant(event)"><div class="field"><label>اسم التاجر</label><input name="merchant" required maxlength="60" autocomplete="name"></div><div class="field"><label>اسم المتجر</label><input name="store" required maxlength="60"></div><div class="field"><label>رقم الهاتف</label><input name="phone" required inputmode="tel" maxlength="20" autocomplete="tel"></div><div class="field"><label>كلمة المرور (8 أحرف على الأقل)</label><input name="password" type="password" required minlength="8" autocomplete="new-password"></div><div class="field"><label>تأكيد كلمة المرور</label><input name="confirm" type="password" required minlength="8" autocomplete="new-password"></div><button class="btn">إنشاء الحساب والدخول</button></form><div class="auth-switch">'+(first?'':'لديك حساب بالفعل؟ <button class="linkbtn" onclick="authScreen(\\'login\\')">تسجيل الدخول</button>')+'</div><p class="auth-note">الحساب محلي على هذا الجهاز فقط، ولا توجد مزامنة سحابية أو رسائل SMS حاليًا. احتفظ بنسخة احتياطية من بياناتك.</p>'+extra+'</div></div>';
 }else{
 root.innerHTML='<div class="auth-wrap"><div class="auth-card"><div class="auth-mark">م</div><h2>مرحبًا بعودتك</h2><p class="notice">سجّل الدخول إلى حساب متجرك.</p><form onsubmit="loginMerchant(event)"><div class="field"><label>رقم الهاتف</label><input name="phone" required inputmode="tel" autocomplete="username"></div><div class="field"><label>كلمة المرور</label><input name="password" type="password" required autocomplete="current-password"></div><button class="btn">تسجيل الدخول</button></form><div class="auth-switch">مستخدم جديد؟ <button class="linkbtn" onclick="authScreen(\\'register\\')">إنشاء حساب تاجر</button></div><p class="auth-note">استعادة كلمة المرور غير متاحة تلقائيًا لأن التطبيق لا يستخدم خادمًا أو خدمة رسائل. لا تحذف بيانات التطبيق قبل حفظ نسخة احتياطية.</p>'+extra+'</div></div>';
 }
}
function newSalt(){if(!window.MohasibiSecurity||!window.MohasibiSecurity.newSalt)throw new Error('ميزة حماية الحساب غير متاحة في هذه النسخة.');return window.MohasibiSecurity.newSalt()}
function securityHash(p,s){if(!window.MohasibiSecurity||!window.MohasibiSecurity.hashPassword)throw new Error('ميزة حماية كلمة المرور غير متاحة. حدّث التطبيق.');return window.MohasibiSecurity.hashPassword(p,s)}
function registerMerchant(e){
 e.preventDefault();var f=new FormData(e.target),merchant=String(f.get('merchant')).trim(),store=String(f.get('store')).trim(),phone=String(f.get('phone')).trim().replace(/\s/g,''),password=String(f.get('password'));
 if(password!==String(f.get('confirm'))){authScreen('register','كلمتا المرور غير متطابقتين.');return}
 var a=accountsLoad();if(a.some(x=>x.phone===phone)){authScreen('login','هذا الرقم مسجل بالفعل. سجّل الدخول.');return}
 try{var salt=newSalt(),hash=securityHash(password,salt),account={merchant:merchant,store:store,phone:phone,salt:salt,hash:hash};a.push(account);accountsSave(a);
 var old=localStorage.getItem('mohasibi_data_v1'),key='mohasibi_data_v1_'+encodeURIComponent(phone);
 if(old&&!localStorage.getItem(key)){try{var parsed=JSON.parse(old);if(Array.isArray(parsed.products)&&Array.isArray(parsed.sales)&&Array.isArray(parsed.expenses))localStorage.setItem(key,old)}catch(ignore){}}
 enterMerchant(account);toast('تم إنشاء حساب التاجر بنجاح');
 }catch(err){authScreen('register',err.message||'تعذر إنشاء الحساب.')}
}
function loginMerchant(e){
 e.preventDefault();var f=new FormData(e.target),phone=String(f.get('phone')).trim().replace(/\s/g,''),password=String(f.get('password')),a=accountsLoad().find(x=>x.phone===phone);
 if(!a){authScreen('login','لا يوجد حساب بهذا الرقم.');return}
 try{if(securityHash(password,a.salt)!==a.hash){authScreen('login','كلمة المرور غير صحيحة.');return}enterMerchant(a);toast('تم تسجيل الدخول')}catch(err){authScreen('login',err.message||'تعذر تسجيل الدخول')}
}
function enterMerchant(a){currentMerchant=a;KEY='mohasibi_data_v1_'+encodeURIComponent(a.phone);db=load();if(!Array.isArray(db.products)||!Array.isArray(db.sales)||!Array.isArray(db.expenses))db={products:[],sales:[],expenses:[]};tab='home';viewStack=[];document.querySelector('.nav').classList.remove('hidden');render()}
function logout(){if(!confirm('هل تريد تسجيل الخروج؟ بياناتك ستبقى محفوظة على هذا الهاتف.'))return;currentMerchant=null;db={products:[],sales:[],expenses:[]};viewStack=[];document.querySelector('.nav').classList.add('hidden');authScreen('login')}
function initAuth(){if(accountsLoad().length===0)authScreen('register');else authScreen('login')}
initAuth();
</script></body></html>
