<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#0c1424"><title>محاسبي</title><style>
:root{--bg:#09101d;--p:#111d30;--p2:#17253b;--g:#d9b45b;--t:#f5f1e7;--m:#aab5c6;--r:#f07878;--gr:#57c69b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:system-ui,sans-serif}header{padding:13px 15px;background:linear-gradient(140deg,#172943,#0c1424);border-bottom:1px solid #28364b;position:sticky;top:0;z-index:4}.head{display:flex;justify-content:space-between;align-items:center}.brand{display:flex;gap:10px;align-items:center}.logo{width:42px;height:42px;border:2px solid var(--g);border-radius:12px;display:grid;place-items:center;color:var(--g);font-size:23px;font-weight:900}.brand h1{margin:0;font-size:21px}.brand small{color:var(--m)}main{max-width:850px;margin:auto;padding:14px 12px 105px}.btn,.back{border:0;border-radius:10px;padding:10px 13px;background:var(--g);color:#172033;font-weight:800;font-size:13px}.back,.secondary{background:var(--p2);border:1px solid #34445d;color:var(--t)}.danger{background:#512d37;color:#ffd7d7}.cards,.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.stat,.panel,.tile{background:var(--p);border:1px solid #25334a;border-radius:15px;padding:13px}.stat span{font-size:12px;color:var(--m)}.stat strong{display:block;color:var(--g);font-size:19px;margin-top:5px;overflow-wrap:anywhere}.tile{text-align:right;color:var(--t);font-weight:800;min-height:74px}.tile b{display:block;color:var(--g);font-size:22px}.section{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:19px 2px 9px}.section h2{font-size:16px;margin:0}.nav{position:fixed;bottom:0;left:0;right:0;background:#101b2d;border-top:1px solid #2b3a50;display:flex;justify-content:space-around;padding:7px 2px calc(7px + env(safe-area-inset-bottom));z-index:5}.nav button{background:none;border:0;color:var(--m);font-size:10px;display:grid;gap:2px}.nav b{font-size:19px}.nav .active{color:var(--g)}.row{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid #26354a}.row:last-child{border:0}.row small{display:block;color:var(--m);margin-top:4px;line-height:1.5}.amount{color:var(--g);font-weight:800;white-space:nowrap}.empty{text-align:center;color:var(--m);padding:23px}.field{display:grid;gap:5px;margin:10px 0}.field label,.note{font-size:12px;color:var(--m)}input,select{width:100%;padding:11px;border:1px solid #34445d;border-radius:10px;background:#0c1728;color:var(--t);font:inherit}form .btn{width:100%;margin-top:8px}.actions{display:flex;gap:6px;flex-wrap:wrap}.actions .btn{flex:1}.hidden{display:none!important}.note{line-height:1.8}.toast{position:fixed;top:10px;left:10px;right:10px;background:#203b34;color:#d7ffed;padding:12px;border-radius:10px;z-index:9;display:none}.auth{max-width:460px;margin:24px auto;padding:0 12px}.auth .panel{padding:20px}.auth h2{color:var(--g)}.auth .logo{margin:auto;width:55px;height:55px;font-size:30px}.link{background:none;border:0;color:var(--g);font-weight:bold}
</style></head><body><header><div class="head"><div class="brand"><div class="logo">م</div><div><h1>محاسبي</h1><small id="caption">إدارة المتجر والحسابات</small></div></div><button id="back" class="back hidden" onclick="goBack()">‹ رجوع</button></div></header><main id="app"></main><div id="toast" class="toast"></div><nav id="nav" class="nav hidden"><button data-tab="home"><b>⌂</b>الرئيسية</button><button data-tab="products"><b>▦</b>المخزون</button><button data-tab="sales"><b>▤</b>المبيعات</button><button data-tab="customers"><b>♙</b>العملاء</button><button data-tab="more"><b>☷</b>المزيد</button></nav>
<script>
let KEY='',db={},merchant=null,tab='home',historyStack=[],formOpen=false;
function fresh(){return {products:[],customers:[],suppliers:[],sales:[],purchases:[],expenses:[],incomes:[],customerPayments:[],supplierPayments:[],returns:[],settings:{currency:'ر.ي',lowStock:5}}}
function load(){try{return Object.assign(fresh(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){return fresh()}}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function money(v){return (Number(v)||0).toLocaleString('ar-YE',{maximumFractionDigits:2})+' '+(db.settings.currency||'ر.ي')}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function total(a,k){return (a||[]).reduce((n,x)=>n+(+x[k]||0),0)}
function date(){return new Date().toLocaleDateString('ar-YE')}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function toast(s){let x=document.getElementById('toast');x.textContent=s;x.style.display='block';setTimeout(()=>x.style.display='none',2300)}
function go(t){historyStack.push({tab,formOpen});tab=t;formOpen=false;render()}
function goBack(){if(formOpen){formOpen=false;render();return}if(historyStack.length){let x=historyStack.pop();tab=x.tab;formOpen=x.formOpen;render();return}if(tab!=='home'){tab='home';render();return}if(window.MohasibiSecurity?.exitApp)window.MohasibiSecurity.exitApp();else toast('أنت في الرئيسية')}
function backUpdate(){document.getElementById('back').classList.toggle('hidden',!merchant||(tab==='home'&&!formOpen))}
function sec(t,b=''){return '<div class="section"><h2>'+t+'</h2>'+b+'</div>'}
function btn(t,call,cl=''){return '<button class="btn '+cl+'" onclick="'+call+'">'+t+'</button>'}
function tile(t,ico,call){return '<button class="tile" onclick="'+call+'"><b>'+ico+'</b>'+t+'</button>'}
function row(t,s,v,extra=''){return '<div class="row"><div><strong>'+t+'</strong><small>'+esc(s||'')+'</small>'+extra+'</div><div class="amount">'+v+'</div></div>'}
document.querySelectorAll('.nav button').forEach(x=>x.onclick=()=>go(x.dataset.tab));
function cash(){return total(db.sales,'paid')+total(db.customerPayments,'amount')+total(db.incomes,'amount')-total(db.supplierPayments,'amount')-total(db.purchases,'paid')-total(db.expenses,'amount')}
function render(){
 backUpdate();document.getElementById('nav').classList.remove('hidden');document.getElementById('caption').textContent=merchant.store+' · '+merchant.merchant;document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));
 let h='',app=document.getElementById('app');
 if(tab==='home'){
 h='<p class="note">ملخص المتجر — بيانات مستقلة ومحفوظة على هذا الجهاز.</p><div class="cards">'+
 [['المبيعات',total(db.sales,'total')],['المصروفات',total(db.expenses,'amount')],['ديون العملاء',total(db.customers,'balance')],['مستحقات الموردين',total(db.suppliers,'balance')],['المنتجات',db.products.length],['وحدات المخزون',db.products.reduce((n,p)=>n+(+p.qty||0),0)],['الصندوق',cash()],['الإيرادات الأخرى',total(db.incomes,'amount')]].map(x=>'<div class="stat"><span>'+x[0]+'</span><strong>'+ (typeof x[1]==='number'&&x[0]!=='المنتجات'&&x[0]!=='وحدات المخزون'?money(x[1]):x[1])+'</strong></div>').join('')+'</div>'+
 sec('الأقسام')+'<div class="tiles">'+tile('المنتجات والمخزون','▦',"go('products')")+tile('المبيعات والفواتير','▤',"go('sales')")+tile('العملاء والديون','♙',"go('customers')")+tile('الموردون','♧',"go('suppliers')")+tile('المشتريات','🛒',"go('purchases')")+tile('المصروفات','↘',"go('expenses')")+tile('الصندوق والإيرادات','▣',"go('cash')")+tile('التقارير والأرباح','◫',"go('reports')")+'</div>'+sec('عمليات سريعة')+'<div class="panel actions">'+btn('＋ بيع جديد',"openForm('sale')")+btn('＋ قبض دين',"openForm('customerPayment')",'secondary')+btn('＋ منتج',"openForm('product')",'secondary')+'</div>';
 }else if(tab==='products'){
 h=sec('المنتجات والمخزون',btn('＋ إضافة منتج',"openForm('product')"))+'<div class="panel">'+(db.products.length?db.products.map((p,i)=>row(esc(p.name),'كمية '+p.qty+' · باركود '+(p.barcode||'—')+' · شراء '+money(p.cost)+' / بيع '+money(p.price),money(p.qty*p.price),'<div class="actions">'+btn('تعديل',"edit('products',"+i+")",'secondary')+btn('حذف',"del('products',"+i+")",'danger')+'</div>')).join(''):'<div class="empty">لا توجد منتجات</div>')+'</div><p class="note">يدعم حفظ رقم الباركود والبحث اليدوي؛ مسح الكاميرا يحتاج إضافة قارئ مخصص.</p>';
 }else if(tab==='sales'){
 h=sec('فواتير المبيعات',btn('＋ فاتورة بيع',"openForm('sale')"))+'<div class="panel">'+(db.sales.length?db.sales.slice().reverse().map((s,i)=>row(esc(s.invoice)+' · '+esc(s.customerName),s.date+' · '+s.payment+' · متبقي '+money(s.due),money(s.total),'<div class="actions">'+btn('تفاصيل',"details('sales',"+(db.sales.length-1-i)+")",'secondary')+btn('مرتجع',"openForm('return',"+(db.sales.length-1-i)+")",'secondary')+'</div>')).join(''):'<div class="empty">لا توجد فواتير</div>')+'</div>';
 }else if(tab==='customers'){
 h=sec('العملاء والديون',btn('＋ عميل جديد',"openForm('customer')"))+'<div class="panel">'+(db.customers.length?db.customers.map((c,i)=>row(esc(c.name),esc(c.phone)+' · الرصيد المتبقي',money(c.balance),'<div class="actions">'+btn('كشف الحساب',"details('customers',"+i+")",'secondary')+btn('دفعة',"openForm('customerPayment',"+i+")")+btn('تعديل',"edit('customers',"+i+")",'secondary')+'</div>')).join(''):'<div class="empty">لا يوجد عملاء</div>')+'</div>';
 }else if(tab==='suppliers'){
 h=sec('الموردون والمبالغ المستحقة',btn('＋ مورد جديد',"openForm('supplier')"))+'<div class="panel">'+(db.suppliers.length?db.suppliers.map((s,i)=>row(esc(s.name),esc(s.phone)+' · المتبقي للمورد',money(s.balance),'<div class="actions">'+btn('كشف الحساب',"details('suppliers',"+i+")",'secondary')+btn('دفعة',"openForm('supplierPayment',"+i+")")+btn('تعديل',"edit('suppliers',"+i+")",'secondary')+'</div>')).join(''):'<div class="empty">لا يوجد موردون</div>')+'</div>';
 }else if(tab==='purchases'){
 h=sec('المشتريات وفواتير التوريد',btn('＋ فاتورة شراء',"openForm('purchase')"))+'<div class="panel">'+(db.purchases.length?db.purchases.slice().reverse().map((p,i)=>row(esc(p.invoice)+' · '+esc(p.supplierName),p.date+' · '+p.payment+' · مستحق '+money(p.due),money(p.total),btn('تفاصيل',"details('purchases',"+(db.purchases.length-1-i)+")",'secondary'))).join(''):'<div class="empty">لا توجد مشتريات</div>')+'</div>';
 }else if(tab==='expenses'){
 h=sec('المصروفات',btn('＋ مصروف جديد',"openForm('expense')"))+'<div class="panel">'+(db.expenses.length?db.expenses.slice().reverse().map(x=>row(esc(x.name),x.date+' · '+esc(x.category),money(x.amount))).join(''):'<div class="empty">لا توجد مصروفات</div>')+'</div>';
 }else if(tab==='cash'){
 h=sec('الصندوق والإيرادات',btn('＋ إيراد آخر',"openForm('income')"))+'<div class="stat"><span>رصيد الصندوق المحسوب</span><strong>'+money(cash())+'</strong></div>'+sec('الإيرادات الأخرى')+'<div class="panel">'+(db.incomes.length?db.incomes.slice().reverse().map(x=>row(esc(x.name),x.date,money(x.amount))).join(''):'<div class="empty">لا توجد إيرادات</div>')+'</div>'+sec('حركة المقبوضات والمدفوعات')+'<div class="panel">'+db.customerPayments.slice().reverse().map(x=>row('قبض من '+esc(x.customerName),x.date,money(x.amount))).join('')+db.supplierPayments.slice().reverse().map(x=>row('دفع إلى '+esc(x.supplierName),x.date,'-'+money(x.amount))).join('')+'</div>';
 }else if(tab==='reports'){
 let rev=total(db.sales,'total'),cost=total(db.sales,'cost'),exp=total(db.expenses,'amount'),net=rev-cost-exp+total(db.incomes,'amount');
 h=sec('التقارير المالية')+'<div class="panel">'+row('إجمالي المبيعات','',money(rev))+row('تكلفة البضاعة المباعة','',money(cost))+row('مجمل الربح','',money(rev-cost))+row('المصروفات','',money(exp))+row('إيرادات أخرى','',money(total(db.incomes,'amount')))+row('صافي الربح التقديري','',money(net))+row('ديون العملاء','',money(total(db.customers,'balance')))+row('مستحقات الموردين','',money(total(db.suppliers,'balance')))+row('قيمة المخزون بالتكلفة','',money(db.products.reduce((n,p)=>n+p.qty*p.cost,0)))+'</div>';
 }else if(tab==='more'){
 h=sec('المزيد')+'<div class="tiles">'+tile('المشتريات','🛒',"go('purchases')")+tile('الموردون','♧',"go('suppliers')")+tile('المصروفات','↘',"go('expenses')")+tile('الصندوق','▣',"go('cash')")+tile('التقارير','◫',"go('reports')")+tile('النسخ الاحتياطي','⬇',"go('backup')")+tile('الإعدادات','⚙',"go('settings')")+'</div>'+sec('حساب التاجر')+'<div class="panel">'+row(esc(merchant.store),esc(merchant.merchant)+' · '+esc(merchant.phone),'')+btn('تسجيل الخروج','logout()','danger')+'</div>';
 }else if(tab==='backup'){
 h=sec('النسخ الاحتياطي والاستعادة')+'<div class="panel"><p class="note">تتضمن النسخة المنتجات والعملاء والموردين والفواتير والديون والدفعات والمصروفات والإيرادات.</p>'+btn('تصدير نسخة احتياطية','backup()')+' '+btn('استعادة ملف','document.getElementById("restore").click()','secondary')+'<input id="restore" type="file" accept="application/json" class="hidden" onchange="restore(this)"><p id="backupMsg" class="note">احفظ الملف خارج الهاتف. الاستعادة تستبدل بيانات الحساب الحالي.</p></div>';
 }else if(tab==='settings'){
 h=sec('إعدادات المتجر')+'<div class="panel"><form onsubmit="settingsSave(event)"><div class="field"><label>اسم المتجر</label><input name="store" value="'+esc(merchant.store)+'" required></div><div class="field"><label>اسم التاجر</label><input name="merchant" value="'+esc(merchant.merchant)+'" required></div><div class="field"><label>العملة</label><input name="currency" value="'+esc(db.settings.currency)+'" required></div><div class="field"><label>حد تنبيه المخزون</label><input name="low" type="number" min="0" value="'+db.settings.lowStock+'"></div><button class="btn">حفظ</button></form></div><p class="note">الحساب محلي على هذا الجهاز ولا توجد مزامنة سحابية أو رسائل SMS.</p>';
 }
 app.innerHTML=h;
}
function input(l,n,t='text',req=true,attrs=''){return '<div class="field"><label>'+l+'</label><input name="'+n+'" type="'+t+'" '+(req?'required ':'')+attrs+'></div>'}
function select(l,n,opts){return '<div class="field"><label>'+l+'</label><select name="'+n+'" required>'+opts+'</select></div>'}
function openForm(type,index){
 historyStack.push({tab,formOpen:false});formOpen=true;let title='',f='',submit='';
 if(type==='product'){title='إضافة منتج';f=input('اسم المنتج','name')+input('الباركود','barcode','text',false)+input('الكمية الافتتاحية','qty','number',true,'min="0"')+input('سعر الشراء','cost','number',true,'min="0" step="0.01"')+input('سعر البيع','price','number',true,'min="0" step="0.01"')+input('حد التنبيه','low','number',false,'min="0"');submit='saveProduct(event)'}
 if(type==='customer'||type==='supplier'){title=type==='customer'?'إضافة عميل':'إضافة مورد';f=input('الاسم','name')+input('رقم الهاتف','phone','tel',false)+input('العنوان / ملاحظات','note','text',false);submit=type==='customer'?'saveCustomer(event)':'saveSupplier(event)'}
 if(type==='sale'){title='فاتورة بيع';let ps=db.products.map((p,i)=>'<option value="'+i+'">'+esc(p.name)+' — متوفر '+p.qty+' — '+money(p.price)+'</option>').join(''),cs='<option value="">بيع نقدي بدون عميل</option>'+db.customers.map((c,i)=>'<option value="'+i+'">'+esc(c.name)+' — دين '+money(c.balance)+'</option>').join('');f=select('المنتج','product',ps)+input('الكمية','qty','number',true,'min="1"')+select('العميل','customer',cs)+input('الخصم','discount','number',false,'min="0" step="0.01" value="0"')+select('طريقة الدفع','payment','<option>نقدي</option><option>آجل</option><option>جزئي</option>')+input('المدفوع الآن (للجزئي)','paid','number',false,'min="0" step="0.01" value="0"');submit='saveSale(event)'}
 if(type==='customerPayment'){title='قبض من عميل';f=select('العميل','customer',db.customers.map((x,i)=>'<option value="'+i+'" '+(i===index?'selected':'')+'>'+esc(x.name)+' — '+money(x.balance)+'</option>').join(''))+input('المبلغ المستلم','amount','number',true,'min="0.01" step="0.01"');submit='saveCustomerPayment(event)'}
 if(type==='supplierPayment'){title='دفع لمورد';f=select('المورد','supplier',db.suppliers.map((x,i)=>'<option value="'+i+'" '+(i===index?'selected':'')+'>'+esc(x.name)+' — '+money(x.balance)+'</option>').join(''))+input('المبلغ المدفوع','amount','number',true,'min="0.01" step="0.01"');submit='saveSupplierPayment(event)'}
 if(type==='purchase'){title='فاتورة شراء';f=select('المورد','supplier',db.suppliers.map((x,i)=>'<option value="'+i+'">'+esc(x.name)+'</option>').join(''))+select('المنتج','product',db.products.map((x,i)=>'<option value="'+i+'">'+esc(x.name)+'</option>').join(''))+input('الكمية','qty','number',true,'min="1"')+input('تكلفة الوحدة','cost','number',true,'min="0" step="0.01"')+select('طريقة الدفع','payment','<option>نقدي</option><option>آجل</option><option>جزئي</option>')+input('المدفوع الآن (للجزئي)','paid','number',false,'min="0" step="0.01" value="0"');submit='savePurchase(event)'}
 if(type==='expense'){title='مصروف جديد';f=input('بيان المصروف','name')+select('التصنيف','category','<option>إيجار</option><option>رواتب</option><option>نقل</option><option>كهرباء وماء</option><option>أخرى</option>')+input('المبلغ','amount','number',true,'min="0.01" step="0.01"');submit='saveExpense(event)'}
 if(type==='income'){title='إيراد آخر';f=input('بيان الإيراد','name')+input('المبلغ','amount','number',true,'min="0.01" step="0.01"');submit='saveIncome(event)'}
 if(type==='return'){title='مرتجع مبيعات';let s=db.sales[index];f='<p class="note">'+esc(s.invoice)+' · '+esc(s.productName)+' · الكمية '+s.qty+'</p>'+input('الكمية المرتجعة','qty','number',true,'min="1" max="'+s.qty+'"')+input('المبلغ المسترد','refund','number',true,'min="0" step="0.01" value="'+s.total+'"');submit='saveReturn(event,'+index+')'}
 document.getElementById('app').innerHTML=sec(title,btn('رجوع','goBack()','secondary'))+'<div class="panel"><form onsubmit="'+submit+'">'+f+'<button class="btn">حفظ العملية</button></form></div>';backUpdate();
}
function finish(msg){save();formOpen=false;historyStack.pop();render();toast(msg)}
function saveProduct(e){e.preventDefault();let f=new FormData(e.target);db.products.push({id:uid(),name:f.get('name'),barcode:f.get('barcode'),qty:+f.get('qty'),cost:+f.get('cost'),price:+f.get('price'),low:+f.get('low')||db.settings.lowStock});finish('تم حفظ المنتج')}
function saveCustomer(e){e.preventDefault();let f=new FormData(e.target);db.customers.push({id:uid(),name:f.get('name'),phone:f.get('phone'),note:f.get('note'),balance:0,ledger:[]});finish('تم حفظ العميل')}
function saveSupplier(e){e.preventDefault();let f=new FormData(e.target);db.suppliers.push({id:uid(),name:f.get('name'),phone:f.get('phone'),note:f.get('note'),balance:0,ledger:[]});finish('تم حفظ المورد')}
function saveSale(e){e.preventDefault();let f=new FormData(e.target),p=db.products[+f.get('product')],q=+f.get('qty'),ci=f.get('customer'),c=ci===''?null:db.customers[+ci];if(!p||q<1||q>p.qty){toast('الكمية غير متوفرة');return}let sum=q*p.price-(+f.get('discount')||0),mode=f.get('payment'),paid=mode==='نقدي'?sum:mode==='آجل'?0:(+f.get('paid')||0);if(sum<0||paid>sum){toast('تحقق من المبلغ والخصم');return}if(!c&&paid<sum){toast('اختر عميلًا للبيع الآجل');return}p.qty-=q;let s={id:uid(),invoice:'INV-'+Date.now().toString().slice(-7),productId:p.id,productName:p.name,qty:q,unitPrice:p.price,cost:p.cost,total:sum,paid:paid,due:sum-paid,customerId:c?.id||'',customerName:c?.name||'نقدي',payment:mode,date:date()};db.sales.push(s);if(c){c.balance+=s.due;c.ledger.push({date:s.date,label:'فاتورة '+s.invoice,amount:s.due})}finish('تم حفظ الفاتورة وتحديث المخزون')}
function saveCustomerPayment(e){e.preventDefault();let f=new FormData(e.target),c=db.customers[+f.get('customer')],v=+f.get('amount');if(!c||v<=0||v>c.balance){toast('المبلغ أكبر من الدين أو العميل غير محدد');return}c.balance-=v;db.customerPayments.push({customerName:c.name,amount:v,date:date()});c.ledger.push({date:date(),label:'دفعة مستلمة',amount:-v});finish('تم تسجيل الدفعة وتخفيض الدين')}
function saveSupplierPayment(e){e.preventDefault();let f=new FormData(e.target),s=db.suppliers[+f.get('supplier')],v=+f.get('amount');if(!s||v<=0||v>s.balance){toast('تحقق من المبلغ والمورد');return}s.balance-=v;db.supplierPayments.push({supplierName:s.name,amount:v,date:date()});s.ledger.push({date:date(),label:'دفعة للمورد',amount:-v});finish('تم تسجيل دفعة المورد')}
function savePurchase(e){e.preventDefault();let f=new FormData(e.target),s=db.suppliers[+f.get('supplier')],p=db.products[+f.get('product')],q=+f.get('qty'),cost=+f.get('cost'),sum=q*cost,mode=f.get('payment'),paid=mode==='نقدي'?sum:mode==='آجل'?0:(+f.get('paid')||0);if(!s||!p||q<1||paid>sum){toast('تحقق من بيانات الشراء');return}p.qty+=q;p.cost=cost;s.balance+=sum-paid;let x={invoice:'PUR-'+Date.now().toString().slice(-7),supplierName:s.name,productName:p.name,qty:q,cost:cost,total:sum,paid:paid,due:sum-paid,payment:mode,date:date()};db.purchases.push(x);s.ledger.push({date:date(),label:'فاتورة '+x.invoice,amount:x.due});finish('تم حفظ المشتريات وزيادة المخزون')}
function saveExpense(e){e.preventDefault();let f=new FormData(e.target);db.expenses.push({name:f.get('name'),category:f.get('category'),amount:+f.get('amount'),date:date()});finish('تم تسجيل المصروف')}
function saveIncome(e){e.preventDefault();let f=new FormData(e.target);db.incomes.push({name:f.get('name'),amount:+f.get('amount'),date:date()});finish('تم تسجيل الإيراد')}
function saveReturn(e,i){e.preventDefault();let f=new FormData(e.target),s=db.sales[i],q=+f.get('qty'),v=+f.get('refund');if(!s||q<1||q>s.qty||v<0){toast('بيانات المرتجع غير صحيحة');return}let p=db.products.find(x=>x.id===s.productId);if(p)p.qty+=q;s.qty-=q;s.total=Math.max(0,s.total-v);let c=db.customers.find(x=>x.id===s.customerId);if(c){let red=Math.min(c.balance,v);c.balance-=red;c.ledger.push({date:date(),label:'مرتجع '+s.invoice,amount:-red})}db.returns.push({invoice:s.invoice,qty:q,refund:v,date:date()});finish('تم تسجيل المرتجع')}
function details(k,i){let x=db[k][i];historyStack.push({tab,formOpen:false});formOpen=true;if(k==='customers'||k==='suppliers'){document.getElementById('app').innerHTML=sec('كشف حساب '+esc(x.name),btn('رجوع','goBack()','secondary'))+'<div class="panel">'+row('الرصيد الحالي','المتبقي',money(x.balance))+(x.ledger||[]).map(l=>row(esc(l.label),l.date,money(l.amount))).join('')+'</div>'}else{document.getElementById('app').innerHTML=sec('تفاصيل '+esc(x.invoice),btn('رجوع','goBack()','secondary'))+'<div class="panel">'+Object.keys(x).filter(k=>k!=='id').map(k=>row(esc(k),'',esc(x[k]))).join('')+'</div>'}backUpdate()}
function edit(k,i){let x=db[k][i];let n=prompt('الاسم',x.name||'');if(n===null)return;if(x.name!==undefined)x.name=n.trim()||x.name;if(k==='products'){let q=prompt('الكمية',x.qty),p=prompt('سعر البيع',x.price);if(q!==null&&+q>=0)x.qty=+q;if(p!==null&&+p>=0)x.price=+p}else{let ph=prompt('رقم الهاتف',x.phone||'');if(ph!==null)x.phone=ph}save();render();toast('تم التعديل')}
function del(k,i){if(!confirm('تأكيد الحذف؟'))return;if(k==='products'&&db.sales.some(s=>s.productId===db.products[i].id)){toast('لا يمكن حذف منتج مرتبط بفواتير');return}db[k].splice(i,1);save();render();toast('تم الحذف')}
function backup(){let o={format:'mohasibi-v2',db:db};let blob=new Blob([JSON.stringify(o,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='mohasibi-backup-'+merchant.phone+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1200);document.getElementById('backupMsg').textContent='تم تجهيز الملف: '+a.download;toast('تم تجهيز النسخة الاحتياطية')}
function restore(i){let f=i.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result),d=x.db||x;if(!Array.isArray(d.products)||!Array.isArray(d.customers)||!Array.isArray(d.suppliers)||!Array.isArray(d.sales))throw Error();if(!confirm('سيتم استبدال بيانات الحساب الحالية. متابعة؟'))return;db=Object.assign(fresh(),d);save();render();toast('تم استرداد البيانات بنجاح')}catch(e){alert('ملف النسخة غير صالح')}};r.readAsText(f)}
function settingsSave(e){e.preventDefault();let f=new FormData(e.target);merchant.store=f.get('store');merchant.merchant=f.get('merchant');db.settings.currency=f.get('currency');db.settings.lowStock=+f.get('low');let a=accounts(),i=a.findIndex(x=>x.phone===merchant.phone);if(i>=0){a[i].store=merchant.store;a[i].merchant=merchant.merchant;localStorage.setItem('mohasibi_accounts_v1',JSON.stringify(a))}save();render();toast('تم حفظ الإعدادات')}
function accounts(){try{return JSON.parse(localStorage.getItem('mohasibi_accounts_v1')||'[]')}catch(e){return []}}
function auth(mode,msg=''){let a=accounts(),reg=mode==='register'||!a.length,extra=msg?'<p class="note">'+esc(msg)+'</p>':'';document.getElementById('nav').classList.add('hidden');document.getElementById('back').classList.add('hidden');if(reg){document.getElementById('app').innerHTML='<div class="auth"><div class="panel"><div class="logo">م</div><h2>إنشاء حساب التاجر</h2><p class="note">كل متجر يحتفظ ببياناته مستقلة على هذا الهاتف.</p><form onsubmit="register(event)">'+input('اسم التاجر','merchant')+input('اسم المتجر','store')+input('رقم الهاتف','phone','tel')+input('كلمة المرور (8 أحرف على الأقل)','password','password',true,'minlength="8"')+input('تأكيد كلمة المرور','confirm','password',true,'minlength="8"')+'<button class="btn">إنشاء الحساب والدخول</button></form>'+(a.length?'<p>لديك حساب؟ <button class="link" onclick="auth(&quot;login&quot;)">تسجيل الدخول</button></p>':'')+'<p class="note">الحساب محلي فقط. لا توجد مزامنة أو استعادة كلمة المرور برسائل SMS.</p>'+extra+'</div></div>'}else{document.getElementById('app').innerHTML='<div class="auth"><div class="panel"><div class="logo">م</div><h2>تسجيل دخول التاجر</h2><form onsubmit="login(event)">'+input('رقم الهاتف','phone')+input('كلمة المرور','password','password')+'<button class="btn">دخول</button></form><p>مستخدم جديد؟ <button class="link" onclick="auth(&quot;register&quot;)">إنشاء حساب</button></p><p class="note">لا يمكن استعادة كلمة المرور تلقائيًا دون خادم تحقق.</p>'+extra+'</div></div>'}}
function hash(p,s){if(!window.MohasibiSecurity)throw Error('ميزة حماية الحساب غير متاحة');return window.MohasibiSecurity.hashPassword(p,s)}
function register(e){e.preventDefault();let f=new FormData(e.target),phone=String(f.get('phone')).trim().replace(/\s/g,''),p=String(f.get('password'));if(p!==String(f.get('confirm'))){auth('register','كلمتا المرور غير متطابقتين');return}let a=accounts();if(a.some(x=>x.phone===phone)){auth('login','الرقم مسجل مسبقًا');return}let salt=window.MohasibiSecurity.newSalt(),x={merchant:f.get('merchant'),store:f.get('store'),phone:phone,salt:salt,hash:hash(p,salt)};a.push(x);localStorage.setItem('mohasibi_accounts_v1',JSON.stringify(a));enter(x)}
function login(e){e.preventDefault();let f=new FormData(e.target),phone=String(f.get('phone')).trim().replace(/\s/g,''),x=accounts().find(a=>a.phone===phone);if(!x){auth('login','الحساب غير موجود');return}if(hash(String(f.get('password')),x.salt)!==x.hash){auth('login','كلمة المرور غير صحيحة');return}enter(x)}
function enter(x){merchant=x;KEY='mohasibi_v2_'+encodeURIComponent(x.phone);db=load();tab='home';historyStack=[];render()}
function logout(){if(!confirm('تسجيل الخروج؟ ستبقى بياناتك محفوظة.'))return;merchant=null;auth('login')}
function init(){let a=accounts();auth(a.length?'login':'register')}
init();
</script></body></html>
